publications:
  title: Publications
  items:
    - venue: UncertaiNLP Workshop at EMNLP 2026
      date: October 2026
      title: "Semantic Calibration Prevails Where Token Confidence Fails: Benchmarking Long-Form Scientific QA"
      authors:
        - firstname: Philip
          lastname: Müller
        - firstname: Nicholas
          lastname: Popovič
        - firstname: Michael
          lastname: Färber
        - firstname: Peter
          lastname: Steinbach
      description: This work introduces a large-scale benchmark for uncertainty calibration in long-form scientific QA, evaluating four methods across 685,000 responses, 20 LLMs, and seven datasets. It finds that token-level and verbalized uncertainty signals fail systematically, while semantic consistency of final answers remains well calibrated in multi-step reasoning settings.
      links:
        - label: Paper
          url: https://aclanthology.org/2026.uncertainlp-main.11/
        - label: View Poster
          url: /assets/documents/Poster_UncertaiNLP_2026_Semantic_Calibration.pdf
        - label: Associated Repository
