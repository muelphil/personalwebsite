posters:
  title: Posters
  items:
    - venue: Science of Benchmarking and Evaluating AI Workshop at EurIPS 2025
      date: December 2025
      title: "Reproducibility by Design: A Modular Framework for Benchmarking Evolving Probabilistic AI Systems"
      url: https://www.hzdr.de/db/!Publications?pNid=head&pSelMenu=0&pSelTitle=42155
      authors:
        - firstname: Philip
          lastname: Müller
        - firstname: Peter
          lastname: Steinbach
      description: This poster presents a modular benchmarking framework designed to ensure reproducibility and transparency when evaluating probabilistic and resource-intensive AI systems, with a focus on uncertainty estimation for large language models. The framework decouples model execution from evaluation logic, enabling consistent, reusable, and longitudinal benchmarking as models and APIs evolve.
      links:
        - label: View Poster
          url: https://philipmueller.dev/assets/documents/Poster_EurIPS_2025_Reproducibility_Framework.pdf
        - label: Abstract
          url: https://philipmueller.dev/documents/eurips_2025_poster
