        - label: Conference Listing
          url: https://sites.google.com/view/benchmarking-and-evaluating-ai/home/accepted-posters#h.ll9ukx7hiunm
        - label: Workshop Website
          url: https://sites.google.com/view/benchmarking-and-evaluating-ai/home
    - venue: Helmholtz AI Conference (HAICON 2025)
      date: June 2025
      title: Uncertainty Estimation of Large Language Model Replies in Natural Sciences
      url: https://hzdr.de/db/!Publications?pNid=head&pSelMenu=0&pSelTitle=41395
      authors:
        - firstname: Philip
          lastname: Müller
        - firstname: Nicholas
          lastname: Popovič
        - firstname: Michael
          lastname: Färber
        - firstname: Peter
          lastname: Steinbach
      description: This poster presents a qualitative and quantitative evaluation of uncertainty metrics for large language models in scientific question answering. It assesses a range of theoretical approaches and benchmarks a subset of metrics for reliability, highlighting the strengths and limitations of token-level, verbalized, and consistency-based measures. The poster was awarded second place for Best Poster in an audience vote among 200 entries.
      links:
        - label: View Poster
          url: https://philipmueller.dev/assets/documents/Poster_HAICON_2025_LLM_Uncertainty_Quantification.pdf
